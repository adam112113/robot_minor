slam_toolbox:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /odom
    # Commonly useful params
    resolution: 0.05
    transform_publish_period: 0.05
    minimum_time_interval: 0.1
    mode: mapping
